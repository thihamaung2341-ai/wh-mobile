<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WH Mobile — Admin</title>
<style>
:root{font-family:Arial,sans-serif;color:#14213d;background:#f2f5fa}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1000px;margin:auto}.panel{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:20px;margin:16px 0}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:block;font-weight:600;margin:10px 0}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin-top:6px;font:inherit}button{border:0;border-radius:8px;background:#2166ff;color:white;padding:11px 16px;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e8eef8;color:#14213d}button:disabled{opacity:.55;cursor:not-allowed}.item{border-top:1px solid #e2e8f0;padding:12px 0;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.muted{color:#64748b}.status{padding:12px;border-radius:8px;background:#eaf1ff;white-space:pre-wrap}#app[hidden],#login[hidden]{display:none!important}@media(max-width:520px){body{padding:12px}.panel{padding:15px}}
</style>
</head>
<body><main class="wrap">
<header><h1>WH Mobile Admin</h1><p class="muted">Manage products, stock, customer orders and repair bookings.</p></header>
<section id="login" class="panel">
<h2>Admin sign in</h2><p>Sign in with the Firebase account assigned as the store administrator.</p>
<form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Log in</button></form>
</section>
<section id="app" hidden>
<div class="panel"><button id="logout" class="secondary">Sign out</button><p id="status" class="status" role="status">Loading…</p></div>
<section class="panel"><h2>Add a product</h2>
<form id="productForm">
<div class="grid">
<label>Product name<input id="productName" required maxlength="100"></label>
<label>Category<input id="category" required maxlength="50" placeholder="Apple, Samsung…"></label>
<label>Price<input id="price" type="number" min="0" step="1" required></label>
<label>Stock quantity<input id="stock" type="number" min="0" step="1" value="1" required></label>
</div>
<label>Description<input id="description" maxlength="180"></label>
<button type="submit">Add product</button>
</form></section>
<section class="panel"><h2>Products & inventory</h2><div id="products">Loading products…</div></section>
<section class="panel"><h2>Customer orders & repair bookings</h2><div id="bookings">Loading bookings…</div></section>
</section>
</main>
<script type="module" src="admin.js"></script>
</body></html>
